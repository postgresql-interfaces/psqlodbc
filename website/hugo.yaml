baseURL: https://odbc.postgresql.org/
locale: en-us
title: psqlODBC

enableRobotsTXT: true
enableGitInfo: false

module:
  imports:
    - path: github.com/imfing/hextra
  mounts:
    - source: content
      target: content
    - source: static
      target: static
    # The release notes are kept once, in Changelog.md at the top of the
    # repository.
    - source: ../Changelog.md
      target: content/changelog.md
    # Files from docs/, which the installer and the source tarball also ship.
    - source: ../docs
      target: static/images
      files:
        - "*.jpg"
    - source: ../docs
      target: static/files
      files:
        - "*.reg"

markup:
  goldmark:
    renderer:
      # Some ported pages keep HTML tables and anchors.
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: HOWTOs
      pageRef: /howto
      weight: 2
    - name: FAQ
      pageRef: /faq
      weight: 3
    - name: Changelog
      pageRef: /changelog
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: https://github.com/postgresql-interfaces/psqlodbc
      params:
        icon: github

params:
  description: The official PostgreSQL ODBC driver.
  navbar:
    displayTitle: true
    displayLogo: false
  footer:
    displayCopyright: true
    displayPoweredBy: false
  editURL:
    enable: true
    base: https://github.com/postgresql-interfaces/psqlodbc/edit/main/website/content
  page:
    width: wide
