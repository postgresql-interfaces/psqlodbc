name: Linux Build
run-name: psql ODBC Linux CI - ${{ github.event.head_commit.message }}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Debian (Ubuntu)
          # The newest PostgreSQL, from apt.postgresql.org, which is where
          # the Debian packaging of the driver builds it. Each major adds
          # expected output under test/expected/v<major> when it changes a
          # message or refuses a setting, and this job is what finds that.
          - os: ubuntu-latest
            name: Debian (PostgreSQL 19)
            pg_major: 19
          - os: ubuntu-latest
            name: Red Hat (Fedora)
            container: fedora:latest

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}

    steps:
    - name: Add the PostgreSQL apt repository (Debian)
      if: matrix.container == '' && matrix.pg_major != ''
      run: |
        sudo apt-get update
        sudo apt-get install -y curl ca-certificates
        sudo install -d /usr/share/postgresql-common/pgdg
        sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
          https://www.postgresql.org/media/keys/ACCC4CF8.asc
        . /etc/os-release
        echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]" \
          "https://apt.postgresql.org/pub/repos/apt $VERSION_CODENAME-pgdg main" |
          sudo tee /etc/apt/sources.list.d/pgdg.list
        # The runner image ships a cluster of its own, which holds port 5432
        # and would leave the new one on 5433. The generated odbc.ini sets no
        # port, so the tests reach 5432 and would test the wrong server.
        if command -v pg_lsclusters > /dev/null 2>&1; then
          pg_lsclusters -h | while read -r ver name rest; do
            sudo pg_dropcluster --stop "$ver" "$name"
          done
        fi

    - name: Install dependencies (Debian)
      if: matrix.container == ''
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf automake libtool \
          libpq-dev unixodbc-dev unixodbc
        # Only the one server, so that the cluster this job starts below is
        # unambiguous.
        if [ -n "${{ matrix.pg_major }}" ]; then
          sudo apt-get install -y \
            postgresql-${{ matrix.pg_major }} \
            postgresql-client-${{ matrix.pg_major }}
        else
          sudo apt-get install -y postgresql postgresql-client
        fi
        if ! command -v odbc_config >/dev/null 2>&1; then
          sudo tee /usr/local/bin/odbc_config > /dev/null <<'EOF'
        #!/bin/sh
        case $1 in
        	--include-prefix) echo "/usr/include" ;;
        	--lib-prefix) echo "/usr/lib" ;;
        	--libs) echo "-lodbc" ;;
        	*) echo "$0: unknown argument '$1'"; exit 1 ;;
        esac
        EOF
          sudo chmod +x /usr/local/bin/odbc_config
        fi

    - name: Install dependencies (Fedora)
      if: matrix.container == 'fedora:latest'
      run: |
        dnf install -y \
          gcc make autoconf automake libtool \
          libpq-devel unixODBC-devel postgresql-server postgresql \
          diffutils git

    - name: Checkout
      uses: actions/checkout@v4

    - name: Bootstrap
      run: autoreconf -fi

    - name: Configure
      run: |
        PG_CONFIG=$(find /usr -name pg_config -type f 2>/dev/null | head -1)
        if [ -n "$PG_CONFIG" ]; then
          export PATH="$(dirname $PG_CONFIG):$PATH"
        fi
        ./configure

    - name: Build
      run: make -j$(nproc)

    - name: Start PostgreSQL (Debian)
      if: matrix.container == ''
      run: |
        sudo mkdir -p /var/run/postgresql
        sudo chown postgres:postgres /var/run/postgresql
        # The generated odbc.ini sets no port, so the tests reach 5432. Pick
        # the cluster that holds that port, rather than whichever comes
        # first, so the job cannot test a server it did not mean to.
        set -- $(pg_lsclusters -h | awk '$3 == 5432 {print $1, $2, $4; exit}')
        [ -n "$1" ] || { echo "no cluster on port 5432"; pg_lsclusters; exit 1; }
        echo "testing against the PostgreSQL $1 cluster $2, currently $3"
        # Installing a server starts its cluster, and pg_ctlcluster fails on
        # one that already runs.
        [ "$3" = online ] || sudo pg_ctlcluster "$1" "$2" start
        sudo -u postgres createuser -s runner
        sudo -u postgres createdb contrib_regression

    - name: Start PostgreSQL (Fedora)
      if: matrix.container == 'fedora:latest'
      run: |
        mkdir -p /var/lib/pgsql/data /var/run/postgresql
        chown postgres:postgres /var/lib/pgsql/data /var/run/postgresql
        su postgres -c 'initdb -D /var/lib/pgsql/data' || { echo "initdb failed"; exit 1; }
        su postgres -c "sed -i 's/^logging_collector = on/logging_collector = off/' /var/lib/pgsql/data/postgresql.conf"
        su postgres -c 'pg_ctl -D /var/lib/pgsql/data -l /tmp/pg.log -t 30 start' || { cat /tmp/pg.log; exit 1; }
        su postgres -c 'createuser -s root'
        createdb contrib_regression

    - name: Test
      run: |
        cd test
        # reset-db reads the server's major version and runsuite compares
        # against test/expected/v<major> where the server has one, so this
        # runs the suite the way a packager does.
        make installcheck || { cat regression.diffs; exit 1; }
