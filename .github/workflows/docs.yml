name: docs

on:
  pull_request:
    paths:
      - 'website/**'
      # The site mounts Changelog.md and files from docs/.
      - 'Changelog.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-deploy.yml'
  workflow_call:
    outputs:
      version:
        description: The driver version in configure.ac
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Hugo downloads the Hextra theme, a Hugo module, with Go.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.163.3'
          extended: true

      - name: Lint the workflows
        if: github.event_name == 'pull_request'
        run: >-
          docker run --rm -v "${PWD}:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          .github/workflows/docs.yml .github/workflows/docs-deploy.yml

      - name: Read the driver version
        id: version
        run: |
          version=$(sed -n 's/^AC_INIT(psqlodbc, \([^,]*\),.*/\1/p' configure.ac)
          if [[ -z "${version}" ]]; then
            echo "::error::No version in the AC_INIT line of configure.ac."
            exit 1
          fi
          echo "The driver version is ${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build
        run: hugo --minify
        working-directory: ./website

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: ./website/public
          retention-days: 7
